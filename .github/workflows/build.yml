name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      # Evaluate every output (both architectures) without building the
      # systems twice; the image jobs below do the real builds.
      - run: nix flake check --no-build --all-systems -L
      - run: bash tests/policy.sh

  image:
    needs: flake-check
    strategy:
      fail-fast: false
      matrix:
        include:
          # qcow2/raw go through make-disk-image, which runs a KVM guest.
          # GitHub-hosted x86 runners expose /dev/kvm; the arm runners do not,
          # so arm images are published as ISO (build them on a KVM-capable
          # arm64 host if you need arm qcow2).
          - runner: ubuntu-24.04
            arch: x86_64-linux
            variant: dev
            format: qcow2
          - runner: ubuntu-24.04
            arch: x86_64-linux
            variant: compute
            format: qcow2
          - runner: ubuntu-24.04
            arch: x86_64-linux
            variant: storage
            format: qcow2
          - runner: ubuntu-24.04
            arch: x86_64-linux
            variant: dev
            format: iso
          - runner: ubuntu-24.04
            arch: x86_64-linux
            variant: compute
            format: iso
          - runner: ubuntu-24.04
            arch: x86_64-linux
            variant: storage
            format: iso
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
            variant: dev
            format: iso
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
            variant: compute
            format: iso
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
            variant: storage
            format: iso
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Build ${{ matrix.format }}
        run: nix build ".#packages.${{ matrix.arch }}.${{ matrix.variant }}-${{ matrix.format }}" -L --out-link result
      - name: SBOM
        run: >-
          nix shell --inputs-from . nixpkgs#syft -c
          syft scan dir:result -o spdx-json > sbom.json
      - name: Collect artifact
        env:
          BASE: ostrium-linux-${{ matrix.variant }}-${{ matrix.arch }}
        run: |
          mkdir -p out
          if [ "${{ matrix.format }}" = iso ]; then
            cp result/iso/*.iso "out/$BASE.iso"
          else
            # make-disk-image writes an uncompressed qcow2; compress it so the
            # release asset stays small (it is still a bootable qcow2).
            nix shell --inputs-from . nixpkgs#qemu-utils -c \
              qemu-img convert -c -O qcow2 "result/nixos.${{ matrix.format }}" "out/$BASE.${{ matrix.format }}"
          fi
          cp sbom.json "out/$BASE-${{ matrix.format }}.spdx.json"
          ls -l out
      - name: Attest provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: out/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ostrium-linux-${{ matrix.variant }}-${{ matrix.arch }}-${{ matrix.format }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Split assets over the 2 GiB limit
        working-directory: dist
        run: |
          for f in *; do
            if [ "$(stat -c %s "$f")" -gt 2000000000 ]; then
              split -b 1900M -d -a 2 "$f" "$f.part"
              sha256sum "$f" >> SHA256SUMS.full
              rm "$f"
            fi
          done
          sha256sum -- * | grep -v ' SHA256SUMS' > ../SHA256SUMS
          [ -f SHA256SUMS.full ] && cat SHA256SUMS.full >> ../SHA256SUMS && rm SHA256SUMS.full
          mv ../SHA256SUMS .
          ls -l
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "ostrium-linux $TAG" \
            --generate-notes \
            --verify-tag
